server.port=8080
server.address=0.0.0.0

# ===============================
# MySQL 数据库配置
# ===============================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/inspection_robot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=inspection_app
spring.datasource.password=Inspection@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 巡检文件保存目录
# 注意：这是机器狗 Linux 主机上的真实目录
# ===============================
inspection.storage-dir=/var/opt/robot/data/inspection_robot/files
inspection.public-prefix=/inspection-files

# ===============================
# 点云激光雷达录制控制
# ===============================
lidar.record.start-url=http://192.168.19.97:8000/api/v2/record/start
lidar.record.stop-url=http://192.168.19.97:8000/api/v2/record/stop
lidar.record.timeout-ms=10000

# ===============================
# 管线仪按键控制脚本
# 管线仪按键控制脚本位于机器狗主机上的固定路径
# ===============================
pipeline.key-control.python=python3
pipeline.key-control.script=/home/user/robot_web/linux_key_control.py
pipeline.key-control.timeout-ms=8000
